# Deep-merged into ~/.hermes/config.yaml by bootstrap.sh. Double-brace placeholders are rendered per agent.
# Secrets never appear here — they live in ~/.hermes/.env (see manifest.json "secrets").

model:
  # Role → OpenRouter preset; change the model fleet-wide there. The preset also carries Otto's web
  # search and page reading (OpenRouter's Web Search / Web Fetch server tools): pick their engine
  # (Exa, Parallel, ...) in the preset, never here. Everything runs on OPENROUTER_API_KEY, which is
  # the brand owner's Energy key, so OpenRouter meters it all and stops it when Energy runs out.
  default: "@preset/agent-hermes"
  provider: openrouter
  base_url: https://openrouter.ai/api/v1

agent:
  # The Sprite is this brand's alone, so Otto has the machine: a terminal, files, Python and a
  # browser (Hermes' Browser Use mode on its packaged Chromium). Web search is the preset's server tool.
  # Every secret in ~/.hermes/.env is this brand's or its owner's own, except HINDSIGHT_API_KEY on a
  # self-hosted memory host, which has no scoped keys yet and so reaches every bank there (risk
  # accepted 2026-10-12; Hindsight Cloud keys are scoped).
  disabled_toolsets:
    - computer_use
    - image_gen
    - tts
    - vision
    - delegation
    - cronjob          # schedules come from the template / DesignInstantly, not the agent
    - clarify          # runs are headless; there is nobody to answer
    - connections
    - web              # search and page reading are the preset's OpenRouter server tools instead
    - search
  # A runaway loop spends the owner's Energy; no single run needs more turns than this.
  max_turns: 60

# Hermes' own background calls (compaction, titles, MCP sampling, approvals, the post-turn review)
# would otherwise inherit the main preset and its paid web tools. This preset has no tools.
auxiliary:
  compression: { provider: openrouter, model: "@preset/agent-hermes-aux" }
  title_generation: { provider: openrouter, model: "@preset/agent-hermes-aux" }
  mcp: { provider: openrouter, model: "@preset/agent-hermes-aux" }
  approval: { provider: openrouter, model: "@preset/agent-hermes-aux" }
  memory_query_rewrite: { provider: openrouter, model: "@preset/agent-hermes-aux" }
  curator: { provider: openrouter, model: "@preset/agent-hermes-aux" }
  background_review: { provider: openrouter, model: "@preset/agent-hermes-aux" }

terminal:
  backend: local
  cwd: "."
  timeout: 180

code_execution:
  mode: project

browser:
  backend: "browser-use"         # one browser_exec tool on Hermes' packaged Chromium (never a cloud provider:
  inactivity_timeout: 120        # BROWSER_USE_API_KEY / BROWSERBASE_API_KEY must never be in .env)

# Runs are headless (API server, cron): nobody is there to answer an approval, and on /v1/runs a
# flagged command would otherwise wait out the timeout. The deny list still blocks under mode "off".
approvals:
  mode: "off"
  unattended_mode: approve
  cron_mode: approve
  timeout: 30
  deny:                          # Otto must not stop or rewire its own gateway
    - "sprite-env services *"
    - "*hermes gateway*"

memory:
  provider: hindsight
  memory_enabled: false          # Hermes' flat-file memory off: one memory, in Hindsight
  user_profile_enabled: false

mcp_servers:
  designinstantly:
    url: "{{DI_APP_URL}}/api/mcp"
    headers:
      # The co-worker's own token (in .env), scoped server-side to this brand.
      Authorization: "Bearer ${DI_MCP_TOKEN}"

cron:
  provider: designinstantly
  designinstantly:
    arm_url: "{{AGENT_CRON_URL}}/v1"
    agent_id: "{{AGENT_ID}}"
  chronos:                       # /api/cron/fire verifies agent-cron's ES256 token with these
    portal_url: "{{AGENT_CRON_URL}}"
    expected_audience: "agent:{{AGENT_ID}}"
    # nas_jwks_url (the inline PEM public key) is set by apply.py from agent-cron-fire-public.pem
