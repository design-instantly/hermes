# Deep-merged into ~/.hermes/config.yaml by bootstrap.sh. Double-brace placeholders are rendered per agent.
# Secrets never appear here — they live in ~/.hermes/.env (see manifest.json "secrets").

model:
  default: "@preset/agent-hermes"      # role → OpenRouter preset; change the model fleet-wide there
  provider: openrouter
  base_url: https://openrouter.ai/api/v1

agent:
  # The Sprite is this brand's alone, so Otto has the machine: a terminal, files, Python and a
  # browser (Hermes' Browser Use mode on its packaged Chromium) and web search. Every secret in ~/.hermes/.env is
  # this brand's own, except HINDSIGHT_API_KEY on a self-hosted memory host, which has no scoped keys
  # yet and so reaches every bank there (risk accepted 2026-10-12; Hindsight Cloud keys are scoped).
  disabled_toolsets:
    - computer_use
    - image_gen
    - tts
    - vision
    - delegation
    - cronjob          # schedules come from the template / DesignInstantly, not the agent
    - clarify          # runs are headless; there is nobody to answer
    - connections

terminal:
  backend: local
  cwd: "."
  timeout: 180

code_execution:
  mode: project

web:
  search_backend: ddgs           # DuckDuckGo, keyless (bootstrap.sh installs the ddgs extra); search only
  extract_backend: keenable      # Keenable's keyless public endpoint, the most generous free tier (~1,000/h);
  provider_tier:                 # on a rate limit Hermes retries on the other keyless vendors
    keenable: free

browser:
  backend: "browser-use"         # one browser_exec tool on Hermes' packaged Chromium (never a cloud provider:
  inactivity_timeout: 120        # BROWSER_USE_API_KEY / BROWSERBASE_API_KEY must never be in .env)

# Runs are headless (API server, cron): nobody is there to answer an approval, and on /v1/runs a
# flagged command would otherwise wait out the timeout. The deny list still blocks under mode "off".
approvals:
  mode: "off"
  unattended_mode: approve
  cron_mode: approve
  timeout: 30
  deny:                          # Otto must not stop or rewire its own gateway
    - "sprite-env services *"
    - "*hermes gateway*"

memory:
  provider: hindsight
  memory_enabled: false          # Hermes' flat-file memory off: one memory, in Hindsight
  user_profile_enabled: false

mcp_servers:
  designinstantly:
    url: "{{DI_APP_URL}}/api/mcp"
    headers:
      # The co-worker's own token (in .env), scoped server-side to this brand.
      Authorization: "Bearer ${DI_MCP_TOKEN}"

cron:
  provider: designinstantly
  designinstantly:
    arm_url: "{{AGENT_CRON_URL}}/v1"
    agent_id: "{{AGENT_ID}}"
  chronos:                       # /api/cron/fire verifies agent-cron's ES256 token with these
    portal_url: "{{AGENT_CRON_URL}}"
    expected_audience: "agent:{{AGENT_ID}}"
    # nas_jwks_url (the inline PEM public key) is set by apply.py from agent-cron-fire-public.pem
